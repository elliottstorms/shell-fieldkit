name: test
on: [push, pull_request]
jobs:
  lint:
    # The kit's whole promise is portable, correct shell. The functional suite
    # proves behavior on gawk and BSD awk, but it cannot catch an unquoted
    # expansion or a non-portable construct that simply never breaks the one
    # path the tests happen to exercise. shellcheck reads every line statically,
    # so a portability or quoting regression fails here before it can merge green.
    #
    # The version is pinned rather than taken from the runner image. The image's
    # ambient shellcheck drifts (it shipped 0.9.0 while this was written) and its
    # advisory checks change between releases, so an unpinned gate is not
    # reproducible: it can flip red on a runner-image bump with no code change,
    # and "clean locally" stops meaning "clean in CI". Pinning makes the result a
    # property of this repo, not of whatever the runner happens to carry.
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
    steps:
      - uses: actions/checkout@v7
      - name: install pinned shellcheck
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: lint
        run: shellcheck lib/*.sh test/*.sh
  suite:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu ships gawk, macos ships a BSD awk. The date arithmetic in
        # report.sh has to work on both, and it did not on the first attempt.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: awk in use
        run: awk --version 2>/dev/null | head -1 || echo "BSD awk (no --version)"
      - name: suite
        run: bash test/run.sh
